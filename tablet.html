<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#EAF4FE">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>놀이팝</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
  /* ── 유아 화면: 카드 그리드 UX ── */
  :root {
    --sky: #EAF4FE; --navy: #1E3A5F; --sun: #FFC93C;
    --coral: #FF7B6B; --mint: #6ED3BF; --lav: #C9A0F0; --white: #FFFFFF;
    --shadow: 0 6px 0 rgba(30, 58, 95, 0.12);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: 'Gowun Dodum', sans-serif; background: var(--sky); color: var(--navy);
    overflow-x: hidden; -webkit-user-select: none; user-select: none;
  }
  header { padding: 28px 32px 8px; display: flex; align-items: center; gap: 14px; }
  .logo-pop {
    width: 46px; height: 46px; border-radius: 50%; background: var(--sun);
    display: flex; align-items: center; justify-content: center; font-size: 26px; flex-shrink: 0;
  }
  h1 { font-family: 'Jua', sans-serif; font-size: 34px; font-weight: 400; letter-spacing: 1px; }
  .header-sub { font-size: 15px; opacity: .6; margin-top: 3px; }
  .class-tag {
    margin-left: auto; font-family: 'Jua', sans-serif; font-size: 17px;
    background: var(--white); border-radius: 999px; padding: 8px 18px;
    box-shadow: var(--shadow); display: none;
  }
  main { padding: 20px 32px 60px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 26px; }
  .card {
    background: var(--white); border-radius: 22px; box-shadow: var(--shadow); overflow: hidden;
    cursor: pointer; border: none; text-align: left; padding: 0; font-family: inherit; color: inherit;
    transition: transform .15s ease;
  }
  .card:nth-child(odd) { transform: rotate(-1deg); }
  .card:nth-child(even) { transform: rotate(1deg); }
  .card:active { transform: scale(.96); }
  .card:focus-visible { outline: 4px solid var(--sun); outline-offset: 3px; }
  .thumb { width: 100%; aspect-ratio: 4/3; object-fit: cover; display: block; background: var(--sky); }
  .thumb-ph {
    width: 100%; aspect-ratio: 4/3; display: flex; align-items: center; justify-content: center;
    font-family: 'Jua', sans-serif; font-size: 72px; color: var(--white);
  }
  .card-body { padding: 14px 16px 16px; }
  .card-title { font-family: 'Jua', sans-serif; font-size: 20px; font-weight: 400; line-height: 1.3; word-break: keep-all; }
  .badges { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 9px; }
  .badge { font-size: 13px; font-weight: 700; padding: 3px 10px; border-radius: 999px; color: var(--navy); }
  .badge.a2 { background: var(--lav); }
  .badge.a3 { background: var(--mint); }
  .badge.a4 { background: var(--sun); }
  .badge.a5 { background: var(--coral); color: var(--white); }
  .state { text-align: center; padding: 90px 20px; font-family: 'Jua', sans-serif; font-size: 24px; opacity: .55; }

  /* ── 반 연결 화면 (토큰이 없을 때만) ── */
  #connect {
    position: fixed; inset: 0; background: var(--sky); z-index: 200;
    display: none; align-items: center; justify-content: center; padding: 24px;
  }
  #connect.open { display: flex; }
  .c-sheet {
    background: var(--white); border-radius: 26px; padding: 34px; width: 100%; max-width: 440px;
    box-shadow: var(--shadow); text-align: center;
  }
  .c-sheet h2 { font-family: 'Jua', sans-serif; font-weight: 400; font-size: 26px; }
  .c-sheet p { font-size: 14px; opacity: .65; margin: 10px 0 20px; line-height: 1.6; }
  .code-field {
    width: 100%; display: flex; align-items: center; justify-content: center;
    border: 2px solid var(--sky); border-radius: 16px; overflow: hidden;
    color: var(--navy); background: var(--white);
  }
  .code-field:focus-within { border-color: var(--sun); }
  .code-prefix {
    font-family: 'Jua', sans-serif; font-size: 26px; letter-spacing: 2px;
    padding: 14px 0 14px 14px; user-select: none;
  }
  .code-input {
    width: 180px; min-width: 0; font-family: 'Jua', sans-serif; font-size: 26px;
    letter-spacing: 3px; padding: 14px 14px 14px 2px; border: 0; outline: 0;
    color: var(--navy); background: transparent;
  }
  .c-btn {
    width: 100%; font-family: 'Jua', sans-serif; font-size: 19px; margin-top: 18px;
    padding: 14px; border: none; border-radius: 16px; cursor: pointer;
    background: var(--sun); color: var(--navy); box-shadow: 0 4px 0 rgba(30,58,95,.15);
  }
  .c-btn:active { transform: translateY(2px); box-shadow: none; }
  .c-err { color: var(--coral); font-size: 14px; margin-top: 12px; display: none; }
  .c-note { font-size: 12.5px; opacity: .5; margin-top: 16px; line-height: 1.6; }

  /* ── iframe 플레이어 (기존 그대로) ── */
  #player { position: fixed; inset: 0; background: var(--navy); z-index: 100; display: none; }
  #player.open { display: block; }
  #playerFrame { width: 100%; height: 100%; border: none; background: var(--white); }
  #closeBtn {
    position: absolute; top: 12px; right: 12px; z-index: 110; width: 56px; height: 56px;
    border-radius: 50%; background: var(--coral); color: var(--white); border: 3px solid var(--white);
    font-size: 26px; font-weight: 700; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,.25);
    display: flex; align-items: center; justify-content: center;
  }
  #resetLink {
    position: fixed; right: 16px; bottom: 14px; font-size: 12px; opacity: .4;
    background: none; border: none; color: var(--navy); cursor: pointer;
  }
  @media (prefers-reduced-motion: reduce) {
    .card, .card:nth-child(odd), .card:nth-child(even) { transform: none; transition: none; }
  }
</style>
<link rel="stylesheet" href="css/pop.css">
</head>
<body class="kids">

<header>
  <div class="logo-pop" aria-hidden="true">🍿</div>
  <div>
    <h1>놀이팝</h1>
    <div class="header-sub">하고 싶은 놀이를 눌러 보세요!</div>
  </div>
  <div class="class-tag" id="classTag"></div>
</header>

<main>
  <div class="grid" id="grid"></div>
  <div class="state" id="stateMsg">놀이를 불러오고 있어요…</div>
</main>

<!-- 반 연결 (첫 사용 시 1회) -->
<div id="connect">
  <div class="c-sheet">
    <h2>🍿 우리 반 연결하기</h2>
    <p>선생님 관리 페이지에 있는 <b>반 코드</b>를 입력해 주세요.<br>한 번만 하면 다음부터는 바로 놀이가 보여요.</p>
    <div class="code-field">
      <span class="code-prefix" aria-hidden="true">POP-</span>
      <input class="code-input" id="codeInput" placeholder="000000" maxlength="6"
             inputmode="numeric" pattern="[0-9]*" autocomplete="off" aria-label="반 코드 숫자 6자리">
    </div>
    <button class="c-btn" id="codeBtn">연결하기</button>
    <div class="c-err" id="codeErr">코드를 찾을 수 없어요. 다시 확인해 주세요.</div>
    <p class="c-note">QR로 연결했다면 이 화면은 나오지 않아요.<br>반 코드는 관리 페이지 → 반 관리에서 볼 수 있어요.</p>
  </div>
</div>

<!-- 놀이 플레이어 (iframe 방식 콘텐츠용) -->
<div id="player">
  <button id="closeBtn" aria-label="놀이 닫기">✕</button>
  <iframe id="playerFrame" title="놀이 화면" allow="autoplay; camera; microphone; fullscreen"></iframe>
</div>

<button id="resetLink">반 연결 해제</button>
<button id="fsBtn" style="position:fixed; left:16px; bottom:14px; font-size:12px; opacity:.4; background:none; border:none; color:var(--navy); cursor:pointer">⛶ 전체화면</button>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/common.js"></script>
<script>
const PALETTE = ['#6ED3BF', '#FFC93C', '#FF7B6B', '#8FB8F6', '#C9A0F0'];
const TOKEN_KEY = 'popTabletToken';

// 토큰 우선순위: URL(?c=토큰, QR로 접속) > localStorage(저장된 반)
let token = new URLSearchParams(location.search).get('c') || localStorage.getItem(TOKEN_KEY) || '';

const grid = document.getElementById('grid');
const stateMsg = document.getElementById('stateMsg');

async function load() {
  if (!token) {
    stateMsg.style.display = 'none';
    document.getElementById('connect').classList.add('open');
    document.getElementById('codeInput').focus();
    return;
  }
  try {
    const { data, error } = await sb.rpc('tablet_data', { p_token: token });
    if (error) throw error;
    if (!data) { // 토큰이 유효하지 않음 (반이 삭제된 경우 등)
      localStorage.removeItem(TOKEN_KEY);
      token = '';
      return load();
    }
    localStorage.setItem(TOKEN_KEY, token); // QR로 처음 왔어도 저장 → 다음부터 자동
    history.replaceState(null, '', location.pathname); // 주소창에서 토큰 감추기
    render(data.class_name, data.plays || []);
  } catch (e) {
    console.error(e);
    stateMsg.textContent = '놀이를 불러오지 못했어요. 선생님을 불러주세요!';
  }
}

function render(className, plays) {
  const classTag = document.getElementById('classTag');
  classTag.textContent = className;
  classTag.style.display = 'block';
  grid.innerHTML = '';

  if (plays.length === 0) {
    stateMsg.textContent = `${className}에 체크된 놀이가 없어요. 선생님, 관리 페이지에서 골라 주세요!`;
    stateMsg.style.display = 'block';
    return;
  }
  stateMsg.style.display = 'none';

  plays.forEach((l, i) => {
    const card = document.createElement('button');
    card.className = 'card';
    const thumb = l.thumb_url
      ? `<img class="thumb" src="${esc(l.thumb_url)}" alt="" loading="lazy">`
      : `<div class="thumb-ph" style="background:${PALETTE[i % PALETTE.length]}">${esc(l.title.charAt(0))}</div>`;
    const badges = (l.ages || []).map(a => {
      const n = a.replace('만', '');
      return `<span class="badge a${n}">${esc(a)}세</span>`;
    }).join('');
    card.innerHTML = `${thumb}<div class="card-body"><div class="card-title">${esc(l.title)}</div><div class="badges">${badges}</div></div>`;
    card.addEventListener('click', () => openPlay(l));
    grid.appendChild(card);
  });
}

/* 놀이 열기 — 기존과 동일: 기본은 같은 탭 이동 (Canva는 임베드 차단),
   iframe 모드는 전체화면 플레이어 */
function openPlay(l) {
  if (l.open_mode === 'iframe') {
    document.getElementById('playerFrame').src = l.url;
    document.getElementById('player').classList.add('open');
    try { document.documentElement.requestFullscreen && document.documentElement.requestFullscreen(); } catch (e) {}
  } else {
    location.href = l.url; // Canva 안의 🏠 홈 버튼으로 돌아옴
  }
}
document.getElementById('closeBtn').addEventListener('click', () => {
  document.getElementById('player').classList.remove('open');
  document.getElementById('playerFrame').src = 'about:blank';
  try { document.exitFullscreen && document.fullscreenElement && document.exitFullscreen(); } catch (e) {}
});

/* 반 코드로 연결 */
async function connectByCode() {
  const digits = document.getElementById('codeInput').value.replace(/\D/g, '').slice(0, 6);
  const code = 'POP-' + digits;
  const err = document.getElementById('codeErr');
  err.style.display = 'none';
  if (digits.length !== 6) {
    err.textContent = '숫자 6자리를 입력해 주세요.';
    err.style.display = 'block';
    return;
  }
  try {
    const { data, error } = await sb.rpc('connect_class', { p_code: code });
    if (error) throw error;
    if (!data || data.length === 0) { err.style.display = 'block'; return; }
    token = data[0].tablet_token;
    localStorage.setItem(TOKEN_KEY, token);
    document.getElementById('connect').classList.remove('open');
    load();
  } catch (e) {
    err.textContent = '연결에 문제가 있어요. 인터넷을 확인해 주세요.';
    err.style.display = 'block';
  }
}
document.getElementById('codeBtn').addEventListener('click', connectByCode);
document.getElementById('codeInput').addEventListener('input', e => {
  e.target.value = e.target.value.replace(/\D/g, '').slice(0, 6);
});
document.getElementById('codeInput').addEventListener('keydown', e => { if (e.key === 'Enter') connectByCode(); });

/* 전체화면 켜기/끄기 (선생님용 — 브라우저에서 열었을 때) */
document.getElementById('fsBtn').addEventListener('click', () => {
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen().catch(() => {});
});

/* 반 연결 해제 (태블릿을 다른 반으로 옮길 때) */
document.getElementById('resetLink').addEventListener('click', () => {
  if (!confirm('이 태블릿의 반 연결을 해제할까요?')) return;
  localStorage.removeItem(TOKEN_KEY);
  token = '';
  location.reload();
});

load();
</script>
</body>
</html>
