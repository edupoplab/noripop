<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#F8FAFC">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png?v=20260921-2">
<link rel="apple-touch-icon" href="icons/icon-192.png?v=20260921-2">
<title>놀이팝</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root {
    --bg: #F8FAFC; --ink: #14233C; --muted: #708099; --blue: #3779E9;
    --blue-deep: #235FC9; --yellow: #FFD451; --coral: #FF6F61; --mint: #50CFB1;
    --violet: #8B78F6; --surface: #FFFFFF;
    --shadow-sm: 0 8px 24px rgba(32, 62, 110, .08);
    --shadow-md: 0 18px 44px rgba(32, 62, 110, .14);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: 'Pretendard', sans-serif; background: var(--bg); color: var(--ink);
    overflow-x: hidden; -webkit-user-select: none; user-select: none;
  }
  button, input { font: inherit; }
  .topbar {
    max-width: 1440px; margin: 0 auto; padding: 24px 36px 12px;
    display: flex; align-items: center; gap: 14px;
  }
  .brand-mark {
    position: relative; width: 56px; height: 56px; border-radius: 19px; flex: 0 0 auto;
    display: grid; place-items: center; color: #fff; background: var(--blue);
    box-shadow: 0 10px 22px rgba(55,121,233,.28); font-weight: 900; font-size: 24px;
  }
  .brand-mark::after {
    content: ''; position: absolute; width: 13px; height: 13px; border-radius: 50%;
    background: var(--yellow); right: -4px; top: -4px; box-shadow: -13px -2px 0 #fff;
  }
  h1 { font-size: 25px; font-weight: 900; letter-spacing: -.04em; margin-top: 2px; }
  .class-tag {
    margin-left: auto; font-size: 15px; font-weight: 800;
    background: var(--surface); border-radius: 999px; padding: 11px 18px;
    box-shadow: var(--shadow-sm); display: none; align-items: center; gap: 8px;
  }
  .class-tag::before { content: '●'; color: var(--mint); font-size: 10px; }
  main { max-width: 1440px; margin: 0 auto; padding: 18px 36px 80px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 18px; }
  .card {
    background: var(--surface); border-radius: 24px; box-shadow: var(--shadow-sm); overflow: hidden;
    cursor: pointer; border: 0; text-align: left; padding: 0; color: inherit; transition: all .2s ease;
  }
  .card:hover { transform: translateY(-6px); box-shadow: var(--shadow-md); }
  .card:active { transform: scale(.95); }
  .card:focus-visible { outline: 4px solid rgba(55,121,233,.35); outline-offset: 4px; }
  .thumb-wrap { position: relative; margin: 10px; border-radius: 18px; overflow: hidden; background: #EEF3FA; }
  .thumb-wrap::after { content: '시작  ›'; position: absolute; right: 10px; bottom: 10px; padding: 7px 10px; border-radius: 999px; background: rgba(20,35,60,.82); color: #fff; font-size: 11px; font-weight: 800; backdrop-filter: blur(7px); }
  .thumb { width: 100%; aspect-ratio: 16/10; object-fit: cover; display: block; }
  .thumb-ph {
    width: 100%; aspect-ratio: 16/10; display: flex; align-items: center; justify-content: center;
    font-size: 64px; font-weight: 900; color: var(--surface);
  }
  .card-body { padding: 8px 18px 20px; }
  .card-title { font-size: 18px; font-weight: 850; line-height: 1.32; word-break: keep-all; letter-spacing: -.02em; }
  .badges { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 11px; }
  .badge { font-size: 11px; font-weight: 750; padding: 5px 9px; border-radius: 999px; color: #536580; background: #EFF3F8; }
  .state { text-align: center; padding: 70px 20px; color: var(--muted); font-size: 15px; font-weight: 650; }
  .state::before { content: '✦'; display: block; width: 54px; height: 54px; line-height: 54px; margin: 0 auto 14px; border-radius: 18px; background: #E7EEFF; color: var(--blue); font-size: 24px; }
  #connect {
    position: fixed; inset: 0; background: rgba(20,35,60,.62); backdrop-filter: blur(12px); z-index: 200;
    display: none; align-items: center; justify-content: center; padding: 24px;
  }
  #connect.open { display: flex; }
  .c-sheet {
    background: var(--surface); border-radius: 28px; padding: 38px; width: 100%; max-width: 440px;
    box-shadow: 0 30px 70px rgba(12,28,55,.25); text-align: center;
  }
  .connect-mark { width: 58px; height: 58px; border-radius: 19px; display: grid; place-items: center; margin: 0 auto 18px; background: var(--blue); color: #fff; font-size: 24px; font-weight: 900; }
  .c-sheet h2 { font-weight: 900; font-size: 25px; letter-spacing: -.03em; }
  .c-sheet p { font-size: 14px; color: var(--muted); margin: 11px 0 22px; line-height: 1.65; }
  .code-field {
    width: 100%; display: flex; align-items: center; justify-content: center;
    border: 0; border-radius: 17px; overflow: hidden; color: var(--ink); background: #F0F4FA;
    box-shadow: inset 0 0 0 2px transparent; transition: all .2s ease;
  }
  .code-field:focus-within { background: #fff; box-shadow: inset 0 0 0 2px var(--blue),0 0 0 5px rgba(55,121,233,.11); }
  .code-prefix {
    font-size: 23px; font-weight: 850; letter-spacing: 2px; padding: 15px 0 15px 15px; user-select: none;
  }
  .code-input {
    width: 180px; min-width: 0; font-size: 23px; font-weight: 850; letter-spacing: 3px;
    padding: 15px 15px 15px 2px; border: 0; outline: 0; color: var(--ink); background: transparent;
  }
  .c-btn {
    width: 100%; font-size: 16px; font-weight: 850; margin-top: 16px; padding: 15px;
    border: 0; border-radius: 16px; cursor: pointer; background: var(--blue); color: #fff;
    box-shadow: 0 10px 20px rgba(55,121,233,.24); transition: all .2s ease;
  }
  .c-btn:hover { transform: translateY(-2px); filter: brightness(1.03); }
  .c-btn:active { transform: scale(.95); box-shadow: none; }
  .c-err { color: var(--coral); font-size: 14px; margin-top: 12px; display: none; }
  .c-note { font-size: 12px !important; color: #97A5B8 !important; margin-top: 17px !important; }

  #player { position: fixed; inset: 0; background: var(--ink); z-index: 100; display: none; }
  #player.open { display: flex; flex-direction: column; }
  #playerFrame { width: 100%; flex: 1; min-height: 0; border: none; background: var(--surface); }
  .player-controls { display: flex; justify-content: center; gap: 12px; padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); background: #fff; border-top: 1px solid #E1E8F2; }
  .player-controls button { min-height: 48px; flex: 1; max-width: 280px; border: 0; border-radius: 14px; background: #EAF2FF; color: var(--ink); font-weight: 800; cursor: pointer; }
  .player-controls button:first-child { background: var(--blue); color: #fff; }
  .player-controls button:focus-visible { outline: 3px solid var(--yellow); outline-offset: 2px; }
  html:not(.native-app) #closeBtn { display: none; }
  html.native-app .player-controls { display: none; }
  .player-help { background: #fff; color: var(--muted); text-align: center; font-size: 12px; padding: 6px 12px; }
  .player-help summary { cursor: pointer; }
  .player-help a { display: inline-block; padding: 8px; color: var(--blue-deep); }
  html.native-app .player-help { display: none; }
  #closeBtn {
    position: absolute; top: 12px; right: 12px; z-index: 110; width: 56px; height: 56px;
    border-radius: 18px; background: var(--coral); color: #fff; border: 3px solid #fff;
    font-size: 26px; font-weight: 700; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,.25);
    display: flex; align-items: center; justify-content: center;
  }
  .utility { position: fixed; bottom: 12px; border: 0; background: transparent; color: #91A0B4; font-size: 11px; font-weight: 650; cursor: pointer; padding: 7px; }
  #resetLink { right: 14px; }
  #fsBtn { left: 14px; }

  /* 유아용 단순 화면: 정보는 최소화하고 놀이 카드만 크게 표시 */
  body { background: #F8FAFC; }
  .topbar { padding: 24px 32px 10px; }
  .brand-mark {
    width: 50px; height: 50px; border-radius: 17px; background: #3779E9;
    font-size: 25px; box-shadow: 0 8px 20px rgba(55,121,233,.22);
  }
  .brand-mark::after { display: none; }
  .brand-copy h1 { margin: 0; font-size: 28px; }
  .header-sub { margin-top: 3px; color: #708099; font-size: 14px; font-weight: 600; }
  main { padding-top: 20px; }
  .grid { grid-template-columns: repeat(auto-fill,minmax(230px,1fr)); gap: 20px; }
  .card { border-radius: 24px; }
  .thumb-wrap { margin: 10px 10px 0; }
  .thumb-wrap::after { content: '▶'; width: 34px; height: 34px; display: grid; place-items: center; padding: 0; }
  .card-body { padding: 15px 18px 19px; }
  .card-title { font-size: 19px; }
  .state { background: #fff; border-radius: 24px; box-shadow: var(--shadow-sm); margin-top: 10px; }
  @media (max-width: 720px) {
    .topbar, main { padding-left: 20px; padding-right: 20px; }
    .grid { grid-template-columns: repeat(2,minmax(0,1fr)); gap: 14px; }
    .card-title { font-size: 16px; }
    .card-body { padding: 12px 14px 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
  }
</style>
</head>
<body>
<header class="topbar">
  <div class="brand-mark" aria-hidden="true">🍿</div>
  <div class="brand-copy">
    <h1>놀이팝</h1>
    <div class="header-sub">하고 싶은 놀이를 눌러보세요</div>
  </div>
  <div class="class-tag" id="classTag"></div>
</header>

<main>
  <section>
    <div class="grid" id="grid"></div>
  </section>
  <div class="state" id="stateMsg">놀이를 불러오고 있어요…</div>
</main>

<!-- 반 연결 (첫 사용 시 1회) -->
<div id="connect">
  <div class="c-sheet">
    <div class="connect-mark">P!</div>
    <h2>우리 반 연결하기</h2>
    <p>선생님 관리 페이지에 있는 <b>반 코드</b>를 입력해 주세요.<br>한 번만 하면 다음부터는 바로 놀이가 보여요.</p>
    <div class="code-field">
      <span class="code-prefix" aria-hidden="true">POP-</span>
      <input class="code-input" id="codeInput" placeholder="000000" maxlength="6"
             inputmode="numeric" pattern="[0-9]*" autocomplete="off" aria-label="반 코드 숫자 6자리">
    </div>
    <button class="c-btn" id="codeBtn">연결하기</button>
    <div class="c-err" id="codeErr">코드를 찾을 수 없어요. 다시 확인해 주세요.</div>
    <p class="c-note">QR로 연결했다면 이 화면은 나오지 않아요.<br>반 코드는 관리 페이지 → 반 관리에서 볼 수 있어요.</p>
  </div>
</div>

<!-- 놀이 플레이어 (iframe 방식 콘텐츠용) -->
<div id="player">
  <button id="closeBtn" aria-label="놀이 닫기">✕</button>
  <iframe id="playerFrame" title="놀이 화면" allow="autoplay; camera; microphone; fullscreen"></iframe>
  <details class="player-help" id="playerHelp">
    <summary>놀이 화면이 나오지 않나요?</summary>
    <p>내부 실행을 지원하지 않는 사이트는 새 탭으로 열어 주세요. 이 탭에 놀이 목록이 남아 있어요.</p>
    <a id="externalPlayLink" target="_blank" rel="noopener noreferrer">새 탭에서 열기</a>
  </details>
  <nav class="player-controls" aria-label="놀이 이동">
    <button type="button" id="playListBtn">⌂ 놀이 목록으로</button>
    <button type="button" id="restartPlayBtn">↻ 다시 시작</button>
  </nav>
</div>

<button id="resetLink" class="utility">반 연결 해제</button>
<button id="fsBtn" class="utility">⛶ 전체화면</button>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/common.js?v=20260921-1"></script>
<script>
const PALETTE = ['#3779E9', '#50CFB1', '#FF6F61', '#8B78F6', '#F2B824'];
const TOKEN_KEY = 'popTabletToken';
const isNativeApp = /NoriPopKiosk\//.test(navigator.userAgent);
document.documentElement.classList.toggle('native-app', isNativeApp);
let currentPlayUrl = '';
let lastPlayCard = null;

// 토큰 우선순위: URL(?c=토큰, QR로 접속) > localStorage(저장된 반)
let token = new URLSearchParams(location.search).get('c') || localStorage.getItem(TOKEN_KEY) || '';

const grid = document.getElementById('grid');
const stateMsg = document.getElementById('stateMsg');

async function load() {
  if (!token) {
    stateMsg.hidden = true;
    document.getElementById('connect').classList.add('open');
    document.getElementById('codeInput').focus();
    return;
  }
  try {
    const { data, error } = await sb.rpc('tablet_data', { p_token: token });
    if (error) throw error;
    if (!data) { // 토큰이 유효하지 않음 (반이 삭제된 경우 등)
      localStorage.removeItem(TOKEN_KEY);
      token = '';
      return load();
    }
    localStorage.setItem(TOKEN_KEY, token); // QR로 처음 왔어도 저장 → 다음부터 자동
    history.replaceState(null, '', location.pathname); // 주소창에서 토큰 감추기
    render(data.class_name, data.plays || []);
  } catch (e) {
    console.error(e);
    stateMsg.textContent = '놀이를 불러오지 못했어요. 선생님을 불러주세요!';
    stateMsg.hidden = false;
  }
}

function render(className, plays) {
  const classTag = document.getElementById('classTag');
  classTag.textContent = className;
  classTag.style.display = 'flex';
  grid.innerHTML = '';

  if (plays.length === 0) {
    stateMsg.textContent = `${className}에 아직 추천 놀이가 없어요. 선생님과 함께 첫 놀이를 골라보세요!`;
    stateMsg.hidden = false;
    return;
  }
  stateMsg.hidden = true;

  plays.forEach((l, i) => {
    const card = document.createElement('button');
    card.className = 'card';
    const thumb = l.thumb_url
      ? `<img class="thumb" src="${esc(l.thumb_url)}" alt="" loading="lazy">`
      : `<div class="thumb-ph" style="background:${PALETTE[i % PALETTE.length]}">${esc(l.title.charAt(0))}</div>`;
    const badges = (l.ages || []).map(a => {
      const n = a.replace('만', '');
      return `<span class="badge">${esc(n)}세</span>`;
    }).join('');
    card.innerHTML = `<div class="thumb-wrap">${thumb}</div><div class="card-body">
      <div class="card-title">${esc(l.title)}</div><div class="badges">${badges}</div></div>`;
    card.addEventListener('click', () => openPlay(l));
    grid.appendChild(card);
  });
}

/* 내부 실행은 하단 조작 영역을 유지. 외부 실행은 웹 목록 탭을 보존한다. */
function openPlay(l) {
  if (!isNativeApp || l.open_mode === 'iframe') {
    currentPlayUrl = l.url;
    lastPlayCard = document.activeElement;
    document.getElementById('playerFrame').src = currentPlayUrl;
    document.getElementById('externalPlayLink').href = currentPlayUrl;
    document.getElementById('playerHelp').open = false;
    document.getElementById('player').classList.add('open');
    document.getElementById(isNativeApp ? 'closeBtn' : 'playListBtn').focus();
    try { document.documentElement.requestFullscreen?.().catch(() => {}); } catch (e) {}
  } else {
    location.href = l.url;
  }
}
function closePlay() {
  document.getElementById('player').classList.remove('open');
  document.getElementById('playerFrame').src = 'about:blank';
  currentPlayUrl = '';
  document.getElementById('externalPlayLink').removeAttribute('href');
  lastPlayCard?.focus();
  try { if (document.fullscreenElement) document.exitFullscreen().catch(() => {}); } catch (e) {}
}
document.getElementById('closeBtn').addEventListener('click', closePlay);
document.getElementById('playListBtn').addEventListener('click', closePlay);
document.getElementById('restartPlayBtn').addEventListener('click', () => {
  if (currentPlayUrl && confirm('놀이를 처음부터 다시 열까요? 진행 중인 내용은 사라질 수 있어요.')) {
    document.getElementById('playerFrame').src = currentPlayUrl;
  }
});

/* 반 코드로 연결 */
async function connectByCode() {
  const digits = document.getElementById('codeInput').value.replace(/\D/g, '').slice(0, 6);
  const code = 'POP-' + digits;
  const err = document.getElementById('codeErr');
  err.style.display = 'none';
  if (digits.length !== 6) {
    err.textContent = '숫자 6자리를 입력해 주세요.';
    err.style.display = 'block';
    return;
  }
  try {
    const { data, error } = await sb.rpc('connect_class', { p_code: code });
    if (error) throw error;
    if (!data || data.length === 0) { err.style.display = 'block'; return; }
    token = data[0].tablet_token;
    localStorage.setItem(TOKEN_KEY, token);
    document.getElementById('connect').classList.remove('open');
    load();
  } catch (e) {
    err.textContent = '연결에 문제가 있어요. 인터넷을 확인해 주세요.';
    err.style.display = 'block';
  }
}
document.getElementById('codeBtn').addEventListener('click', connectByCode);
document.getElementById('codeInput').addEventListener('input', e => {
  e.target.value = e.target.value.replace(/\D/g, '').slice(0, 6);
});
document.getElementById('codeInput').addEventListener('keydown', e => { if (e.key === 'Enter') connectByCode(); });

/* 전체화면 켜기/끄기 (선생님용 — 브라우저에서 열었을 때) */
document.getElementById('fsBtn').addEventListener('click', () => {
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen().catch(() => {});
});

/* 반 연결 해제 (태블릿을 다른 반으로 옮길 때) */
document.getElementById('resetLink').addEventListener('click', () => {
  if (!confirm('이 태블릿의 반 연결을 해제할까요?')) return;
  localStorage.removeItem(TOKEN_KEY);
  token = '';
  location.reload();
});

load();
</script>
</body>
</html>
