<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>놀이팝 · 로그인</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
  :root {
    --sky: #EAF4FE; --navy: #1E3A5F; --sun: #FFC93C;
    --coral: #FF7B6B; --mint: #6ED3BF; --white: #fff; --line: #DCE8F5;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Gowun Dodum', sans-serif; background: var(--sky); color: var(--navy);
    min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .box { width: 100%; max-width: 400px; }
  .logo { text-align: center; margin-bottom: 22px; }
  .logo h1 { font-family: 'Jua', sans-serif; font-weight: 400; font-size: 40px; letter-spacing: 2px; }
  .logo .pop { color: var(--coral); }
  .logo p { font-size: 14px; opacity: .65; margin-top: 6px; }
  .panel { background: var(--white); border-radius: 22px; padding: 28px; box-shadow: 0 6px 0 rgba(30,58,95,.12); }
  .tabs { display: flex; gap: 8px; margin-bottom: 18px; }
  .tab {
    flex: 1; font-family: 'Jua', sans-serif; font-size: 16px; padding: 11px;
    border: 1.5px solid var(--line); border-radius: 12px; background: var(--white);
    color: var(--navy); cursor: pointer;
  }
  .tab.on { background: var(--navy); border-color: var(--navy); color: var(--white); }
  label { display: block; font-size: 13px; opacity: .7; margin: 14px 0 6px; }
  input {
    width: 100%; font-family: inherit; font-size: 15px; color: var(--navy);
    padding: 11px 14px; border: 1.5px solid var(--line); border-radius: 12px;
  }
  input:focus { outline: none; border-color: var(--sun); }
  .btn {
    width: 100%; font-family: 'Jua', sans-serif; font-size: 17px; margin-top: 22px;
    padding: 13px; border: none; border-radius: 14px; cursor: pointer;
    background: var(--sun); color: var(--navy); box-shadow: 0 4px 0 rgba(30,58,95,.15);
  }
  .btn:active { transform: translateY(2px); box-shadow: none; }
  .btn:disabled { opacity: .55; }
  .msg { font-size: 14px; margin-top: 12px; display: none; line-height: 1.5; }
  .msg.bad { color: var(--coral); display: block; }
  .msg.ok { color: #1F8A70; display: block; }
  .founding {
    margin-top: 16px; background: rgba(255,201,60,.22); border-radius: 12px;
    padding: 11px 14px; font-size: 13px; line-height: 1.55; display: none;
  }
  .note { font-size: 12px; opacity: .55; margin-top: 14px; text-align: center; line-height: 1.6; }
</style>
<link rel="stylesheet" href="css/pop.css">
</head>
<body>
<div class="box">
  <div class="logo">
    <h1>놀이<span class="pop">팝</span> 🍿</h1>
    <p>아이디어가 팝! 터지는 유아교사 놀이 플랫폼</p>
  </div>
  <div class="panel">
    <div class="tabs">
      <button class="tab on" id="tabLogin">로그인</button>
      <button class="tab" id="tabSignup">회원가입</button>
    </div>

    <div id="signupOnly" style="display:none">
      <label for="fNick">닉네임 (다른 선생님에게 보여요)</label>
      <input type="text" id="fNick" maxlength="12" placeholder="예: 팝콘선생님">
    </div>

    <label for="fEmail">이메일</label>
    <input type="email" id="fEmail" autocomplete="email" placeholder="teacher@example.com">

    <label for="fPw">비밀번호 (6자 이상)</label>
    <input type="password" id="fPw" autocomplete="current-password">

    <div class="founding" id="foundingBanner"></div>
    <div class="msg" id="msg"></div>
    <button class="btn" id="goBtn">로그인</button>
    <p class="note">개인정보는 이메일과 닉네임만 저장해요.<br>유아의 정보는 어떤 것도 수집하지 않아요.</p>
  </div>
</div>

<!-- 약관 동의 팝업 (가입하기를 누르면 표시) -->
<div id="consentModal" style="position:fixed; inset:0; background:rgba(30,58,95,.45); display:none; align-items:center; justify-content:center; z-index:50; padding:20px">
  <div style="background:var(--white); border-radius:22px; padding:26px; width:100%; max-width:420px; max-height:88vh; overflow-y:auto">
    <h2 style="font-family:'Jua',sans-serif; font-weight:400; font-size:20px; margin-bottom:10px">🍿 가입 전에 확인해 주세요</h2>
    <div style="background:var(--sky); border-radius:14px; padding:13px 16px; font-size:13px; line-height:1.8; margin-bottom:14px">
      · 올린 놀이의 저작권은 <b>선생님</b>에게 있어요<br>
      · 퍼온 자료는 "나만 쓰기"만 가능해요 (저작권 보호)<br>
      · 수집하는 개인정보는 <b>이메일·닉네임뿐</b>, 유아 정보는 없어요
    </div>
    <label style="display:flex; align-items:center; gap:9px; margin:12px 0; font-size:15px; font-family:'Jua',sans-serif; opacity:1; cursor:pointer">
      <input type="checkbox" id="agreeAll" style="width:20px;height:20px;accent-color:#1E3A5F"> 전체 동의해요
    </label>
    <div style="border-top:1.5px solid var(--sky); padding-top:10px">
      <label style="display:flex; align-items:center; gap:9px; margin:9px 0; font-size:13.5px; opacity:1; cursor:pointer">
        <input type="checkbox" class="agreeItem" id="agreeTerms" style="width:17px;height:17px;accent-color:#1E3A5F">
        <span>(필수) 이용약관 동의 <a href="terms.html" target="_blank" style="color:#1E3A5F; opacity:.6">전문 보기</a></span>
      </label>
      <label style="display:flex; align-items:center; gap:9px; margin:9px 0; font-size:13.5px; opacity:1; cursor:pointer">
        <input type="checkbox" class="agreeItem" id="agreePrivacy" style="width:17px;height:17px;accent-color:#1E3A5F">
        <span>(필수) 개인정보 수집·이용 동의 <a href="privacy.html" target="_blank" style="color:#1E3A5F; opacity:.6">전문 보기</a></span>
      </label>
    </div>
    <div style="display:flex; gap:10px; margin-top:16px">
      <button class="btn" id="consentCancel" style="background:var(--sky); box-shadow:none; width:auto; margin-top:0; flex:1">취소</button>
      <button class="btn" id="consentOk" style="margin-top:0; flex:2" disabled>동의하고 가입하기</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/common.js"></script>
<script>
let mode = 'login'; // 'login' | 'signup'
let settings = {};

const tabLogin = document.getElementById('tabLogin');
const tabSignup = document.getElementById('tabSignup');
const goBtn = document.getElementById('goBtn');
const msg = document.getElementById('msg');

function setMode(m) {
  mode = m;
  tabLogin.classList.toggle('on', m === 'login');
  tabSignup.classList.toggle('on', m === 'signup');
  document.getElementById('signupOnly').style.display = m === 'signup' ? 'block' : 'none';
  goBtn.textContent = m === 'login' ? '로그인' : '팝콘 세계에 가입하기';
  msg.className = 'msg';
  // 파운딩 증정 안내 (설정이 켜져 있을 때만)
  const banner = document.getElementById('foundingBanner');
  const on = String(settings.founding_enabled) === 'true';
  const days = parseInt(settings.founding_gift_days) || 0;
  if (m === 'signup' && on && days > 0) {
    banner.innerHTML = `🎉 <b>오픈 멤버 혜택</b> (선착순 ${parseInt(settings.open_member_limit) || 100}명) — 지금 가입하면 플러스 이용권 <b>${Math.round(days / 30)}개월</b>이 자동으로 적립돼요!`;
    banner.style.display = 'block';
  } else banner.style.display = 'none';
}
tabLogin.addEventListener('click', () => setMode('login'));
tabSignup.addEventListener('click', () => setMode('signup'));

async function go() {
  const email = document.getElementById('fEmail').value.trim();
  const pw = document.getElementById('fPw').value;
  const nick = document.getElementById('fNick').value.trim();
  msg.className = 'msg';
  if (!email || !pw) { msg.className = 'msg bad'; msg.textContent = '이메일과 비밀번호를 입력해 주세요.'; return; }
  if (mode === 'signup' && !nick) { msg.className = 'msg bad'; msg.textContent = '닉네임을 입력해 주세요.'; return; }
  // 가입은 약관 동의 팝업을 먼저 — 동의 후 실제 가입 진행
  if (mode === 'signup') {
    document.getElementById('consentModal').style.display = 'flex';
    return;
  }

  goBtn.disabled = true; goBtn.textContent = '확인 중…';
  try {
    {
      const { error } = await sb.auth.signInWithPassword({ email, password: pw });
      if (error) throw error;
      location.href = 'my.html';
    }
  } catch (e) {
    msg.className = 'msg bad';
    const t = String(e.message || e);
    if (t.includes('already registered')) msg.textContent = '이미 가입된 이메일이에요. 로그인 탭을 이용해 주세요.';
    else if (t.includes('Invalid login')) msg.textContent = '이메일 또는 비밀번호가 맞지 않아요.';
    else if (t.includes('at least 6')) msg.textContent = '비밀번호는 6자 이상이어야 해요.';
    else msg.textContent = '문제가 생겼어요: ' + t;
  }
  goBtn.disabled = false;
  goBtn.textContent = mode === 'login' ? '로그인' : '팝콘 세계에 가입하기';
}
goBtn.addEventListener('click', go);
document.getElementById('fPw').addEventListener('keydown', e => { if (e.key === 'Enter') go(); });

/* ───── 약관 동의 팝업 ───── */
const agreeAll = document.getElementById('agreeAll');
const agreeItems = [...document.querySelectorAll('.agreeItem')];
const consentOk = document.getElementById('consentOk');
function syncConsent() {
  const all = agreeItems.every(i => i.checked);
  agreeAll.checked = all;
  consentOk.disabled = !all;
}
agreeAll.addEventListener('change', () => { agreeItems.forEach(i => { i.checked = agreeAll.checked; }); syncConsent(); });
agreeItems.forEach(i => i.addEventListener('change', syncConsent));
document.getElementById('consentCancel').addEventListener('click', () => {
  document.getElementById('consentModal').style.display = 'none';
});
consentOk.addEventListener('click', async () => {
  document.getElementById('consentModal').style.display = 'none';
  const email = document.getElementById('fEmail').value.trim();
  const pw = document.getElementById('fPw').value;
  const nick = document.getElementById('fNick').value.trim();
  goBtn.disabled = true; goBtn.textContent = '가입 중…';
  try {
    const { error } = await sb.auth.signUp({
      email, password: pw,
      options: { data: { nickname: nick } } // 가입 트리거가 프로필에 저장
    });
    if (error) throw error;
    msg.className = 'msg ok';
    msg.textContent = '가입 완료! 잠시 후 관리 페이지로 이동해요. 🍿';
    setTimeout(() => location.href = 'my.html', 900);
  } catch (e) {
    msg.className = 'msg bad';
    const t = String(e.message || e);
    if (t.includes('already registered')) msg.textContent = '이미 가입된 이메일이에요. 로그인 탭을 이용해 주세요.';
    else if (t.includes('at least 6')) msg.textContent = '비밀번호는 6자 이상이어야 해요.';
    else msg.textContent = '문제가 생겼어요: ' + t;
  }
  goBtn.disabled = false; goBtn.textContent = '팝콘 세계에 가입하기';
});

// 이미 로그인 상태면 바로 이동 + 파운딩 배너용 설정 로드
(async () => {
  const { data: { session } } = await sb.auth.getSession();
  if (session) { location.href = 'my.html'; return; }
  try { settings = await loadSettings(); } catch (e) { console.warn(e); }
  setMode('login');
})();
</script>
</body>
</html>
