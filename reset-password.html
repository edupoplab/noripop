<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>놀이팝 · 비밀번호 찾기</title>
<link rel="stylesheet" href="css/pop.css"><style>
body{margin:0;min-height:100vh;display:grid;place-items:center;color:#1e3a5f;font-family:sans-serif}main{box-sizing:border-box;width:min(440px,calc(100% - 32px));background:#fffdf7;padding:30px;border-radius:24px;box-shadow:0 12px 40px #38281015}img{width:150px}h1{font-size:23px}p{font-size:14px;line-height:1.7}label{display:block;margin:18px 0 8px}input{box-sizing:border-box;width:100%;padding:13px;border:1px solid #ded7c4;border-radius:12px;font:inherit}button{width:100%;padding:14px;background:#ffcd38;border:0;border-radius:12px;font:inherit;font-weight:bold;margin-top:20px;color:inherit;cursor:pointer}button:disabled{opacity:.5}a{color:inherit}#status{min-height:25px}input:focus{outline:3px solid #ffcd3870}
</style></head><body><main><a href="index.html"><img src="assets/brand/noripop-simple.png" alt="놀이팝"></a><h1 id="title">비밀번호 찾기</h1>
<p id="help">가입한 교사 계정 이메일로 비밀번호 변경 링크를 보내드려요.</p>
<form id="request"><label for="email">교사 계정 이메일</label><input id="email" type="email" autocomplete="email" required><button>변경 링크 보내기</button></form>
<form id="change" hidden><label for="password">새 비밀번호 (6자 이상)</label><input id="password" type="password" autocomplete="new-password" minlength="6" required><label for="repeat">새 비밀번호 확인</label><input id="repeat" type="password" autocomplete="new-password" minlength="6" required><button>새 비밀번호 저장</button></form>
<p id="status" role="status" aria-live="polite"></p><p><a href="auth.html">로그인으로 돌아가기</a></p></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="js/password-recovery.js"></script></body></html>
